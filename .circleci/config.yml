version: 2.1

jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - checkout
      - run:
          name: Restore Dependencies
          command: dotnet restore
      - run:
          name: Build Project
          command: dotnet build --configuration Release
      - run:
          name: Run Application
          command: dotnet run

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
